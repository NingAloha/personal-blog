name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-22.04
    concurrency:
      group: personal-blog-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            cloudflare/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Test Express backend
        working-directory: backend
        run: npm test

      - name: Test Cloudflare Worker
        working-directory: cloudflare
        run: npm test

      - name: Build Cloudflare production frontend
        working-directory: cloudflare
        run: npm run build:frontend:production

      - name: Verify production frontend metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          grep -Fq 'https://ningaloha.com/' frontend/dist/index.html
          grep -Fq 'index,follow,max-image-preview:large' frontend/dist/index.html
          if grep -Fq 'test.ningaloha.com' frontend/dist/index.html; then
            echo 'Preview URL found in the production frontend build' >&2
            exit 1
          fi
          if grep -Fq 'noindex' frontend/dist/index.html; then
            echo 'Preview indexing policy found in the production frontend build' >&2
            exit 1
          fi

      - name: Validate Cloudflare production deployment
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --env production --outdir .wrangler/dry-run-production

  deploy:
    name: Deploy Cloudflare production
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-22.04
    concurrency:
      group: personal-blog-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN' >&2
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo 'Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID' >&2
            exit 1
          }

      - name: Apply D1 schema migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply CONTENT_DB --remote --env production

      - name: Deploy Worker and Static Assets
        working-directory: cloudflare
        run: npm run deploy:production
